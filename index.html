<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Salesforce Chat - GitHub Pages Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 { color: #0070d2; margin-bottom: 10px; }
    .badge {
      display: inline-block;
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: monospace;
      margin: 5px 5px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Salesforce Embedded Chat</h1>
    <p>Deployment: <strong>Github_Webchat</strong></p>
    <div>
      <span class="badge">Dominio: <span id="current-domain"></span></span>
      <span class="badge">Org: 00DS800000DPelu</span>
    </div>
  </div>

  <script>
    document.getElementById('current-domain').textContent = window.location.origin;

    window.addEventListener('onEmbeddedMessageSent', function () {
      var iframe = document.getElementById('embeddedMessagingFrame');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage('CHECK_SATISFACTION_SURVEY', '*');
      }
    });

    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'es';
        embeddedservice_bootstrap.init(
          '00DS800000DPelu',
          'Github_Webchat',
          'https://zuzenean--pre.sandbox.my.site.com/ESWGithubWebchat1780489820490',
          { scrt2URL: 'https://zuzenean--pre.sandbox.my.salesforce-scrt.com' }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging:', err);
      }
    }
  </script>
  <script
    type="text/javascript"
    src="https://zuzenean--pre.sandbox.my.site.com/ESWGithubWebchat1780489820490/assets/js/bootstrap.min.js"
    onload="initEmbeddedMessaging()">
  </script>
</body>
</html>
