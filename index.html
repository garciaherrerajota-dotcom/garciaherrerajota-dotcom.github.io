<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Salesforce Chat - GitHub Pages Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #0070d2;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            margin: 5px 5px 0 0;
        }
        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid #0070d2;
        }
        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .status.loading { background: #e3f2fd; color: #0c5460; border-left: 4px solid #2196f3; }
        .status.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .status.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .status.warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        button {
            background: #0070d2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: all 0.2s;
        }
        button:hover {
            background: #005fb2;
            transform: translateY(-1px);
        }
        button.secondary {
            background: #6c757d;
        }
        button.secondary:hover {
            background: #5a6268;
        }
        code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .url-card {
            background: #f1f3f5;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            word-break: break-all;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #dee2e6;
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin-top: 20px;
        }
        .deployment-info {
            background: #e8f4f8;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💬 Salesforce Embedded Chat</h1>
            <p>Prueba desde <strong>GitHub Pages</strong> - Deployment: <strong>Github_Webchat</strong></p>
            
            <div>
                <span class="badge">🌐 Dominio: <span id="current-domain"></span></span>
                <span class="badge">🔑 Org: 00DS800000DPelu</span>
                <span class="badge">📦 Deployment: Github_Webchat</span>
            </div>
        </div>


<script>
  document.getElementById('current-domain').textContent = window.location.origin;
  // Eventos oficiales del HOST (aquí es donde deben estar)
  window.addEventListener('onEmbeddedMessagingReady', (event) => {
    console.log('[HOST] ready — evento completo:', event);
  });
  window.addEventListener('onEmbeddedMessageSent', (event) => {
    console.log('[HOST] mensaje — evento completo:', event);
    console.log('[HOST] mensaje — detail:', event.detail);
    try {
      const entry = event.detail && event.detail.conversationEntry;
      if (!entry) return;
      let payload = entry.entryPayload;
      if (typeof payload === 'string') payload = JSON.parse(payload);
      console.log('[HOST] mensaje — payload:', payload);
      if (payload.abstractMessage && payload.abstractMessage.choices) {
        console.log('[HOST] choices → InputDisable');
        postIframeDisable();
      } else if (payload.abstractMessage && payload.abstractMessage.choicesResponse) {
        console.log('[HOST] choicesResponse → InputEnable');
        postIframeEnable();
      }
    } catch (err) {
      console.error('[HOST] error parseando mensaje:', err, event.detail);
    }
  });
  // Debug temporal de postMessage hacia el host
  window.addEventListener('message', (event) => {
    console.log('[HOST][postMessage] origin:', event.origin);
    console.log('[HOST][postMessage] data:', event.data);
  });
  function postIframeEnable() {
    const iframe = document.getElementById('embeddedMessagingFrame');
    if (!iframe || !iframe.contentWindow) {
      console.warn('[HOST] iframe no encontrado (enable)');
      return;
    }
    iframe.contentWindow.postMessage('InputEnable', '*');
  }
  function postIframeDisable() {
    const iframe = document.getElementById('embeddedMessagingFrame');
    if (!iframe || !iframe.contentWindow) {
      console.warn('[HOST] iframe no encontrado (disable)');
      return;
    }
    iframe.contentWindow.postMessage('InputDisable', '*');
  }
  function initEmbeddedMessaging() {
    try {
      embeddedservice_bootstrap.settings.language = 'es';
      embeddedservice_bootstrap.init(
        '00DS800000DPelu',
        'Github_Webchat',
        'https://zuzenean--pre.sandbox.my.site.com/ESWGithubWebchat1780489820490',
        { scrt2URL: 'https://zuzenean--pre.sandbox.my.salesforce-scrt.com' }
      );
    } catch (err) {
      console.error('Error loading Embedded Messaging:', err);
    }
  }
</script>
<script
  type="text/javascript"
  src="https://zuzenean--pre.sandbox.my.site.com/ESWGithubWebchat1780489820490/assets/js/bootstrap.min.js"
  onload="initEmbeddedMessaging()">
</script>

        
</body>
</html>
